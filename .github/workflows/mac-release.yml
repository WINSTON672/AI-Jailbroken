name: Mac downloads
on:
  push:
    branches: [main]
    paths: [.github/workflows/mac-release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac-installer:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      matrix:
        arch: [arm64, x64]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:mac -- --${{ matrix.arch }}
      - name: Publish Mac download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          shasum -a 256 DeepSeek-Desk-0.3.0-mac-${{ matrix.arch }}.dmg > SHA256SUMS-mac-${{ matrix.arch }}.txt
          gh release upload deepseek-desk-v0.3.0 DeepSeek-Desk-0.3.0-mac-${{ matrix.arch }}.dmg SHA256SUMS-mac-${{ matrix.arch }}.txt --clobber
