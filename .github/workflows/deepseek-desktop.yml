name: DeepSeek Desk Windows download
on:
  push:
    branches: [main]
    paths: [.github/workflows/deepseek-desktop.yml]
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:win
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $installer = Get-Item 'dist/DeepSeek Desk Setup 0.3.0.exe'
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Encoding utf8 dist/SHA256SUMS.txt
          gh release create deepseek-desk-v0.3.0 $installer.FullName dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "DeepSeek Desk 0.3.0 (experimental)" --prerelease --notes "Windows x64 installer with exact DeepSeek 1017 setup and automatic startup. Model weights are not bundled. Full CUDA inference is unverified and requires very large GPU/RAM/storage capacity. Installer is unsigned."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
